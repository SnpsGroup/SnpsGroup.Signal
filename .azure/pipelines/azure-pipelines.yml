name: 'SnpsGroup.Signal_$(Date:yyyyMMdd).$(Rev:r)'

trigger:
  branches:
    include:
    - main
    - master
    - release/*
    - desenv
    - vnext
  paths:
    exclude:
    - "*.md"
    - docs/*

pr:
  branches:
    include:
    - main
    - master
    - vnext
  paths:
    exclude:
    - "*.md"
    - docs/*

variables:
- group: SnpsGroup.Global
- name: buildConfiguration
  value: 'Release'

stages:

# ═══════════════════════════════════════════════════════════════
# STAGE 1: GET VERSION
# ═══════════════════════════════════════════════════════════════
- stage: GetVersion
  displayName: 'Get Version'
  pool:
    vmImage: 'ubuntu-latest'
  jobs:
  - job: GetVersionFromAPI
    displayName: 'Query SnpsGroup Version API'
    steps:
    - task: PowerShell@2
      displayName: 'Get Version from External API'
      inputs:
        filePath: '$(Build.SourcesDirectory)/scripts/Get-SnpsGroupVersion.ps1'
        arguments: >
          -CloudProvider $(cloudProvider)
          -Repository SnpsGroup.Signal
          -ApiBaseUrl $(versionApiUrl)
        errorActionPreference: 'stop'
        failOnStderr: false
        workingDirectory: '$(Build.SourcesDirectory)'
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        AZDO_ORGURL: $(System.CollectionUri)
        AZDO_PROJECT: $(System.TeamProject)
      name: 'VersionOutput'

# ═══════════════════════════════════════════════════════════════
# STAGE 2: BUILD (compile + test)
# ═══════════════════════════════════════════════════════════════
- stage: Build
  displayName: 'Build & Test'
  dependsOn: GetVersion
  pool:
    vmImage: 'ubuntu-latest'
  variables:
  - group: SnpsGroup.Global
  - name: fullVersion
    value: $[ stageDependencies.GetVersion.GetVersionFromAPI.outputs['VersionOutput.FullVersion'] ]
  jobs:
  - job: BuildApp
    displayName: 'Build & Test .NET 10 Solution'
    steps:
    - template: templates/nuke-build-steps.yml
      parameters:
        nukeTarget: 'Test'
        fullVersion: '$(fullVersion)'
        publishNukeArtifact: true

# ═══════════════════════════════════════════════════════════════
# STAGE 3: NUGET PUBLISH (main / release/* only)
# ═══════════════════════════════════════════════════════════════
- stage: NuGetPublish
  displayName: 'Publish NuGet Package'
  dependsOn: Build
  condition: >
    and(
      succeeded(),
      or(
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        eq(variables['Build.SourceBranch'], 'refs/heads/master'),
        startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')
      )
    )
  pool:
    vmImage: 'ubuntu-latest'
  variables:
  - group: Signal-Production-Secrets
  - group: SnpsGroup.Global
  - name: fullVersion
    value: $[ stageDependencies.GetVersion.GetVersionFromAPI.outputs['VersionOutput.FullVersion'] ]
  jobs:
  - job: PublishNuGet
    displayName: 'Pack & Push Client Library'
    steps:
    - template: templates/nuke-build-steps.yml
      parameters:
        nukeTarget: 'PushNuGet'
        fullVersion: '$(fullVersion)'
        dockerPassword: '$(DOCKER_REGISTRY_PASSWORD)'

# ═══════════════════════════════════════════════════════════════
# STAGE 4: DOCKER BUILD & PUSH
# ═══════════════════════════════════════════════════════════════
- stage: Docker
  displayName: 'Docker Build & Push'
  dependsOn:
  - Build
  - GetVersion
  pool:
    vmImage: 'ubuntu-latest'
  variables:
  - group: SnpsGroup.Global
  - name: fullVersion
    value: $[ stageDependencies.GetVersion.GetVersionFromAPI.outputs['VersionOutput.FullVersion'] ]
  jobs:
  - job: BuildAndPush
    displayName: 'Build & Push Docker Images'
    steps:
    - template: templates/nuke-build-steps.yml
      parameters:
        nukeTarget: 'DockerPushAll'
        fullVersion: '$(fullVersion)'
        dockerUsername: '$(DOCKER_REGISTRY_USERNAME)'
        dockerPassword: '$(DOCKER_REGISTRY_PASSWORD)'
        setImageTagOutput: true

# ═══════════════════════════════════════════════════════════════
# STAGE 5: DEPLOY DEVELOPMENT (desenv branch — single server)
# ═══════════════════════════════════════════════════════════════
- stage: DeployDevelopment
  displayName: 'Deploy → Development'
  dependsOn:
  - Docker
  - GetVersion
  condition: >
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/desenv')
    )
  variables:
  - group: Signal-Development-Secrets
  - group: SnpsGroup.Global
  - name: fullVersion
    value: $[ stageDependencies.GetVersion.GetVersionFromAPI.outputs['VersionOutput.FullVersion'] ]
  jobs:
  - deployment: DeployToDevelopment
    displayName: 'Deploy to Development (svcfabric01)'
    environment: 'SnpsGroup-Signal-Development'
    pool:
      name: 'SvcFabric-Servers'
      demands:
      - Agent.ComputerName -equals svcfabric01
    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/nuke-deploy-steps.yml
            parameters:
              deployEnvironment: 'development'
              imageVersion: '$(fullVersion)'
              dockerUsername: '$(DOCKER_REGISTRY_USERNAME)'
              dockerPassword: '$(DOCKER_REGISTRY_PASSWORD)'

# ═══════════════════════════════════════════════════════════════
# STAGE 6: DEPLOY STAGING (vnext branch — HA both servers)
# ═══════════════════════════════════════════════════════════════
- stage: DeployStaging
  displayName: 'Deploy → Staging (HA)'
  dependsOn:
  - Docker
  - GetVersion
  condition: >
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/vnext')
    )
  variables:
  - group: Signal-Staging-Secrets
  - group: SnpsGroup.Global
  - name: fullVersion
    value: $[ stageDependencies.GetVersion.GetVersionFromAPI.outputs['VersionOutput.FullVersion'] ]
  jobs:
  - deployment: DeployStagingServer1
    displayName: 'Deploy to Staging (svcfabric01)'
    environment: 'SnpsGroup-Signal-Staging'
    pool:
      name: 'SvcFabric-Servers'
      demands:
      - Agent.ComputerName -equals svcfabric01
    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/nuke-deploy-steps.yml
            parameters:
              deployEnvironment: 'staging'
              imageVersion: '$(fullVersion)'
              dockerUsername: '$(DOCKER_REGISTRY_USERNAME)'
              dockerPassword: '$(DOCKER_REGISTRY_PASSWORD)'

  - deployment: DeployStagingServer2
    displayName: 'Deploy to Staging (svcfabric02)'
    dependsOn: DeployStagingServer1
    environment: 'SnpsGroup-Signal-Staging'
    pool:
      name: 'SvcFabric-Servers'
      demands:
      - Agent.ComputerName -equals svcfabric02
    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/nuke-deploy-steps.yml
            parameters:
              deployEnvironment: 'staging'
              imageVersion: '$(fullVersion)'
              dockerUsername: '$(DOCKER_REGISTRY_USERNAME)'
              dockerPassword: '$(DOCKER_REGISTRY_PASSWORD)'

# ═══════════════════════════════════════════════════════════════
# STAGE 7: DEPLOY PRODUCTION (main / release/* — HA + approval)
# ═══════════════════════════════════════════════════════════════
- stage: DeployProduction
  displayName: 'Deploy → Production (HA)'
  dependsOn:
  - Docker
  - NuGetPublish
  - GetVersion
  condition: >
    and(
      succeeded(),
      or(
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        eq(variables['Build.SourceBranch'], 'refs/heads/master'),
        startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')
      )
    )
  variables:
  - group: Signal-Production-Secrets
  - group: SnpsGroup.Global
  - name: fullVersion
    value: $[ stageDependencies.GetVersion.GetVersionFromAPI.outputs['VersionOutput.FullVersion'] ]
  jobs:
  - deployment: DeployProdServer1
    displayName: 'Deploy to Production (svcfabric01)'
    environment: 'SnpsGroup-Signal-Production'
    pool:
      name: 'SvcFabric-Servers'
      demands:
      - Agent.ComputerName -equals svcfabric01
    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/nuke-deploy-steps.yml
            parameters:
              deployEnvironment: 'production'
              imageVersion: '$(fullVersion)'
              dockerUsername: '$(DOCKER_REGISTRY_USERNAME)'
              dockerPassword: '$(DOCKER_REGISTRY_PASSWORD)'

  - deployment: DeployProdServer2
    displayName: 'Deploy to Production (svcfabric02)'
    dependsOn: DeployProdServer1
    environment: 'SnpsGroup-Signal-Production'
    pool:
      name: 'SvcFabric-Servers'
      demands:
      - Agent.ComputerName -equals svcfabric02
    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/nuke-deploy-steps.yml
            parameters:
              deployEnvironment: 'production'
              imageVersion: '$(fullVersion)'
              dockerUsername: '$(DOCKER_REGISTRY_USERNAME)'
              dockerPassword: '$(DOCKER_REGISTRY_PASSWORD)'
