parameters:
- name: nukeTarget
  type: string
  default: 'Default'
- name: fullVersion
  type: string
  default: ''
- name: dockerUsername
  type: string
  default: ''
- name: dockerPassword
  type: string
  default: ''
- name: setImageTagOutput
  type: boolean
  default: false
- name: publishNukeArtifact
  type: boolean
  default: false

steps:
- checkout: self
  fetchDepth: 1

- task: UseDotNet@2
  inputs:
    packageType: sdk
    version: '10.x'
  displayName: 'Setup .NET 10 SDK'

- script: chmod +x ./build.sh
  displayName: 'Make build.sh executable'

- script: ./build.sh ${{ parameters.nukeTarget }}
  displayName: 'NUKE: ${{ parameters.nukeTarget }}'
  env:
    SNPS_BUILD_VERSION_CONTROL_API: $(versionApiUrl)
    SNPS_IMAGE_VERSION: ${{ parameters.fullVersion }}
    DOCKER_REGISTRY_USERNAME: ${{ parameters.dockerUsername }}
    DOCKER_REGISTRY_PASSWORD: ${{ parameters.dockerPassword }}
    OPENBAO_ROLE_ID: $(OPENBAO_ROLE_ID)
    OPENBAO_SECRET_ID: $(OPENBAO_SECRET_ID)
    VAULT_NAMESPACE: snpsgroup

- ${{ if eq(parameters.setImageTagOutput, true) }}:
  - script: |
      echo "##vso[task.setvariable variable=IMAGE_TAG;isOutput=true]${SNPS_IMAGE_VERSION}"
    displayName: 'Export IMAGE_TAG pipeline variable'
    name: BuildAndPush
    env:
      SNPS_IMAGE_VERSION: ${{ parameters.fullVersion }}

- ${{ if eq(parameters.publishNukeArtifact, true) }}:
  - script: |
      set -e
      NUKE_DIR=$(Build.ArtifactStagingDirectory)/nuke
      mkdir -p "$NUKE_DIR/src/build"
      dotnet publish src/build/_build.csproj \
        -c Release \
        -r linux-x64 \
        --self-contained true \
        -p:Platform=x64 \
        -o "$NUKE_DIR/src/build" \
        --nologo --verbosity quiet
      cp .nuke/parameters.json "$NUKE_DIR/" 2>/dev/null || true
      cp .nuke/build.schema.json "$NUKE_DIR/" 2>/dev/null || true
      cp -r src/build/Templates "$NUKE_DIR/src/build/Templates"
      chmod +x "$NUKE_DIR/src/build/_build"
    displayName: 'Stage NUKE build artifacts'
  - publish: $(Build.ArtifactStagingDirectory)/nuke
    artifact: 'nuke-build'
    displayName: 'Publish NUKE artifact'
