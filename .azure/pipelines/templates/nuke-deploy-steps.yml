parameters:
- name: deployEnvironment
  type: string
- name: imageVersion
  type: string
- name: dockerUsername
  type: string
  default: ''
- name: dockerPassword
  type: string
  default: ''

steps:
- download: current
  artifact: 'nuke-build'
  displayName: 'Download NUKE build artifact'

- script: chmod +x _build
  workingDirectory: $(Pipeline.Workspace)/nuke-build/src/build
  displayName: 'Make _build executable'

- script: |
    ./_build Deploy \
      --deploy-environment ${{ parameters.deployEnvironment }} \
      --image-version ${{ parameters.imageVersion }} \
      --rollback-enabled true \
      --root $(Pipeline.Workspace)/nuke-build
  displayName: 'NUKE: Deploy (${{ parameters.deployEnvironment }})'
  workingDirectory: $(Pipeline.Workspace)/nuke-build/src/build
  env:
    OPENBAO_ROLE_ID: $(OPENBAO_ROLE_ID)
    OPENBAO_SECRET_ID: $(OPENBAO_SECRET_ID)
    OPENBAO_ADDR: $(OPENBAO_ADDR)
    SNPS_BUILD_VERSION_CONTROL_API: $(versionApiUrl)
    SNPS_IMAGE_VERSION: ${{ parameters.imageVersion }}
    DOCKER_REGISTRY_USERNAME: ${{ parameters.dockerUsername }}
    DOCKER_REGISTRY_PASSWORD: ${{ parameters.dockerPassword }}
